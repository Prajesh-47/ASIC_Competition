# Tiny Tapeout project information
project:
  title:        "SPLICE: programmable bus interposer"      # Project title
  author:       "Prajesh-47"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Protocol emulator that can also sit inline on a UART/SPI/I2C bus to observe, emulate or alter traffic"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  # Jane Street protocol emulator competition allocation: 6x4.
  tiles: "6x4"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_prajesh47_splice"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_prajesh47_splice.v"
    - "splice_fifo.v"
    - "splice_engine.v"
    - "splice_latch_rf.v"
    - "splice_host.v"
    - "splice_bridge.v"
    - "splice_capture.v"
    - "RM_IHPSG13_1P_256x16_c2_bm_bist.v"
    - "RM_IHPSG13_1P_512x16_c2_bm_bist.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "HOST_SCK"
  ui[1]: "HOST_MOSI"
  ui[2]: "HOST_CS_N"
  ui[3]: "TRIG_IN"
  ui[4]: "AUX_IN0"
  ui[5]: "AUX_IN1"
  ui[6]: "AUX_IN2"
  ui[7]: "AUX_IN3"

  # Outputs
  uo[0]: "HOST_MISO"
  uo[1]: "IRQ"
  uo[2]: "TRIG_OUT"
  uo[3]: "ACTIVE"
  uo[4]: "AUX_OUT0"
  uo[5]: "AUX_OUT1"
  uo[6]: "AUX_OUT2"
  uo[7]: "AUX_OUT3"

  # Bidirectional pins
  uio[0]: "L0 (pair0 A)"
  uio[1]: "L1 (pair1 A)"
  uio[2]: "L2 (pair2 A)"
  uio[3]: "L3 (pair3 A)"
  uio[4]: "L4 (pair0 B)"
  uio[5]: "L5 (pair1 B)"
  uio[6]: "L6 (pair2 B)"
  uio[7]: "L7 (pair3 B)"

# Do not change!
yaml_version: 6
